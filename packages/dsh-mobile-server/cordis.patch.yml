# The dsh-mobile-server bundle patch: the mobile gateway inside the resident
# `web` profile.
#
# Every row below is INERT unless the process was launched by
# `dsh --profile mobile service start` (env DSH_MOBILE_INSTANCE=1). A plain
# `dsh web` on the same profile must behave exactly like a stock install — this
# file used to disable the shipped directory picker unconditionally, which broke
# "create a workspace" in local runs (the shipped native chooser was gone and
# the replacement had no browser half, so no dialog could open at all).
- insert:
    - id: mobile-gateway
      name: '@bb-84c/dsh-mobile-server/startup'
      disabled: !!js "process.env.DSH_MOBILE_INSTANCE !== '1'"

    # Resident "session sync": enumerate persisted sessions under the shared
    # $DSH_HOME/sessions root and cold-validate/hydrate them into view. Inert
    # unless DSH_MOBILE_INSTANCE=1 (same gate as the gateway). Safe default is
    # enumerate + validate + pre-warm; see src/session-hydrate.js header for the
    # opt-in attach mode (DSH_MOBILE_SESSION_ATTACH=1) and its resume risk.
    - id: mobile-session-hydrate
      name: '@bb-84c/dsh-mobile-server/session-hydrate'
      disabled: !!js "process.env.DSH_MOBILE_INSTANCE !== '1'"

# Remote browsers cannot show the host-native directory dialog (it appears on
# the dsh machine, not the phone), so a mobile-managed instance pins the
# browser-based picker: the shipped `auto` row resolves to native for a
# loopback-bound web, and mounting a chooser next to a backend row fails loudly,
# so auto is disabled and `-browse` is composed directly.
#
# The dialog itself is a SEPARATE package on dsh >= 0.2
# (`dsh-client-ui-directory-picker-browse`, discovered through its `dsh.client`
# declaration — the host row carries no browser half, unlike the bundle patch
# this was originally written against). `service start` sets
# DSH_MOBILE_PICKER_UI=1 only when that package exists in the running
# installation, so older releases keep working without it.
- id: directory-picker
  disabled: !!js "process.env.DSH_MOBILE_INSTANCE === '1'"

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      disabled: !!js "process.env.DSH_MOBILE_INSTANCE !== '1'"

    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
      disabled: !!js "process.env.DSH_MOBILE_PICKER_UI !== '1'"
