<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="dsh mobile — your local DeepSeek Harness, in your pocket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#0e1220"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#8b9cff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#4D6BFE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300"/>
  </g>

  <!-- logo mark: bracket + dot -->
  <g transform="translate(96,92)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#131a2b" stroke="#2a3a5f" stroke-width="2"/>
    <path d="M22 24 h8 a6 6 0 0 1 6 6 v4 a6 6 0 0 0 6 6 h0 a6 6 0 0 0 -6 6 v4 a6 6 0 0 1 -6 6 h-8" fill="none" stroke="#4D6BFE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="4" fill="#7ee787"/>
  </g>

  <text x="96" y="158" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="url(#title)" letter-spacing="1">dsh mobile</text>
  <text x="98" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#e6e8eb" font-weight="400">Your local DeepSeek Harness, in your pocket.</text>
  <text x="98" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#8b949e">Remotely control a resident dsh instance from any device — the official web UI, unchanged. Plugins only, no forks.</text>

  <!-- chips -->
  <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15">
    <rect x="98" y="254" width="118" height="28" rx="14" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="128" y="273" fill="#8b9cff" text-anchor="middle">tailscale</text>
    <rect x="226" y="254" width="104" height="28" rx="14" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="254" y="273" fill="#7ee787" text-anchor="middle">vps relay</text>
    <rect x="340" y="254" width="132" height="28" rx="14" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="374" y="273" fill="#e6e8eb" text-anchor="middle">dsh plugins</text>
  </g>
</svg>
