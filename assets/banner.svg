<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="dsh mobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#0e1220"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#8b9cff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#4D6BFE" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#glow1)"/>
  <rect width="1200" height="240" fill="url(#glow2)"/>

  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200"/>
    <path d="M150 0 V240 M300 0 V240 M450 0 V240 M600 0 V240 M750 0 V240 M900 0 V240 M1050 0 V240"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96,68)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#131a2b" stroke="#2a3a5f" stroke-width="2"/>
    <path d="M22 24 h8 a6 6 0 0 1 6 6 v4 a6 6 0 0 0 6 6 h0 a6 6 0 0 0 -6 6 v4 a6 6 0 0 1 -6 6 h-8" fill="none" stroke="#4D6BFE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="4" fill="#7ee787"/>
  </g>

  <text x="184" y="112" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="48" font-weight="700" fill="url(#title)" letter-spacing="1">dsh mobile</text>

  <!-- chips -->
  <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15">
    <rect x="184" y="142" width="128" height="30" rx="15" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="248" y="162" fill="#8b9cff" text-anchor="middle">tailscale</text>
    <rect x="328" y="142" width="116" height="30" rx="15" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="386" y="162" fill="#7ee787" text-anchor="middle">vps relay</text>
    <rect x="460" y="142" width="146" height="30" rx="15" fill="#131a2b" stroke="#2a3a5f"/>
    <text x="533" y="162" fill="#e6e8eb" text-anchor="middle">dsh plugins</text>
  </g>
</svg>
